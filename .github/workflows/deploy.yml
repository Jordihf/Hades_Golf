name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub recomienda no cortar un despliegue de Pages a medias.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Solo si existe el secreto PRICES_JSON (ver README, «Precios»). Sin él no hay importes y,
      # si SHOW_PRICES=true, el build falla en vez de publicar a medias.
      - name: Prices (optional secret)
        env:
          PRICES_JSON: ${{ secrets.PRICES_JSON }}
        run: |
          if [ -n "$PRICES_JSON" ]; then printf '%s' "$PRICES_JSON" > src/data/prices.json; fi
      # tsc sin @types/react todavía no comprueba el JSX: ver README («Comprobaciones»).
      - name: Basic tsc (no React types yet) and configurator rules
        run: npm run lint && npm run check
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
